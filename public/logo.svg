<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39FF14" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#39FF14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5EFF3A"/>
      <stop offset="100%" stop-color="#22CC00"/>
    </linearGradient>
    <filter id="greenGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Outer glow -->
  <circle cx="100" cy="100" r="98" fill="url(#glow)"/>
  <!-- Black circle bg -->
  <circle cx="100" cy="100" r="94" fill="#0A0A0A"/>
  <!-- Green ring -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="#39FF14" stroke-width="3.5" filter="url(#greenGlow)"/>
  <!-- "90" text -->
  <text x="54" y="115" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="72" fill="url(#greenGrad)" letter-spacing="-2">90</text>
  <!-- "MIN" text -->
  <text x="108" y="105" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="36" fill="#FFFFFF" letter-spacing="1">MIN</text>
  <!-- "TACTICS" text -->
  <text x="40" y="135" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="22" fill="#FFFFFF" letter-spacing="8">TACTICS</text>
  <!-- Green underlines -->
  <line x1="40" y1="142" x2="162" y2="142" stroke="#39FF14" stroke-width="2.5" filter="url(#greenGlow)"/>
  <line x1="40" y1="147" x2="162" y2="147" stroke="#39FF14" stroke-width="1.5" filter="url(#greenGlow)"/>
</svg>
