# Netlify build configuration.
#
# The Next.js runtime (@netlify/plugin-nextjs) is installed automatically when
# Netlify detects Next, so it is not listed here.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Match the Node version the app is developed and tested against.
  NODE_VERSION = "20"
  # Keep Netlify's build log focused on real problems.
  NEXT_TELEMETRY_DISABLED = "1"
  # Netlify's secret scanner fails the build when any environment variable's
  # value appears in the output. These are public by design: NEXT_PUBLIC_*
  # values are inlined into the browser bundle on purpose (the VAPID public
  # key is what the browser subscribes with), and the site URL is printed in
  # every sitemap and canonical link. Only genuinely public keys belong here -
  # never a credential.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_VAPID_PUBLIC_KEY,VAPID_PUBLIC_KEY,NEXT_PUBLIC_SITE_URL,URL"

# Keeps the database warm without anyone having to visit the site.
#
# The app also refreshes itself on read, but that only helps while someone is
# looking. This is the floor: every ten minutes the stalest resources get pulled
# even if the site has had no traffic at all. Each run refreshes only a few
# resources, so it can never exhaust the provider's ten-requests-a-minute quota.
[functions."scheduled-sync"]
  schedule = "*/10 * * * *"
